version: '3.8'

services:
  # 1. Spatial Database (PostGIS for well locations + formations)
  nwis-postgis:
    image: postgis/postgis:15-3.3
    container_name: nwis-spatial-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: nwis_password
      POSTGRES_DB: drilling_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nwis-network

  # 2. Vector Database (Qdrant for RAG / semantic search)
  nwis-qdrant:
    image: qdrant/qdrant:latest
    container_name: nwis-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nwis-network

  # 3. AI Predictive Backend (FastAPI + LightGBM + PostGIS + SHAP)
  nwis-api:
    build: 
      context: ./BACKEND
    container_name: nwis-fastapi-backend
    ports:
      - "8000:8000"
    depends_on:
      - nwis-postgis
      - nwis-qdrant
    environment:
      DATABASE_URL: postgresql://admin:nwis_password@nwis-postgis:5432/drilling_data
      QDRANT_URL: http://nwis-qdrant:6333
    volumes:
      - ./BACKEND:/app
    networks:
      - nwis-network

volumes:
  pgdata:
  qdrant_data:

networks:
  nwis-network:
    driver: bridge